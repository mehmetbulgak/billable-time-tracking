[project]
name = "billable-backend"
version = "1.0.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "DJ",
    "PT",
    "RUF",
    "N",
    "S",
    "DTZ",
    "PIE",
    "RET",
    "TC",
]
ignore = ["RUF012", "TC001", "TC002", "TC003"]
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405", "S105"]
"config/asgi.py" = ["E402"]
"tests/**/*.py" = ["S101", "S105", "S106", "DTZ001"]
"apps/demo/*.py" = ["S105", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --reuse-db -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/management/commands/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
exclude = ["migrations/", "tests/", ".venv/"]

[[tool.mypy.overrides]]
module = ["environ.*", "factory.*", "channels.*", "channels_redis.*", "celery.*", "rest_framework_simplejwt.*", "django_filters.*", "drf_spectacular.*", "corsheaders.*", "daphne.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
